name: Check copy

# The same check as the pre-commit hook, for commits made without it
on:
  push:
  pull_request:

jobs:
  check-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Reads the code without running it, so no dependencies are installed
      - run: python scripts/check_copy.py
